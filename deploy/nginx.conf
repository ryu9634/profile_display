# Nginx 설정 예시
# 위치: /etc/nginx/sites-available/portfolio
#
# YOUR_DOMAIN.com 을 실제 도메인으로 바꾼 뒤 사용하세요.
# HTTPS 인증서는 Certbot 으로 발급합니다:
#   sudo certbot --nginx -d YOUR_DOMAIN.com -d www.YOUR_DOMAIN.com

upstream portfolio_backend {
    server localhost:8080;
    keepalive 32;
}

# ── HTTP: 인증서 갱신 요청만 받고 나머지는 HTTPS 로 보냅니다 ──────────────
#
# 이 리다이렉트가 없으면 평문 HTTP 로도 사이트가 열립니다.
# 애플리케이션은 운영에서 세션 쿠키에 Secure 를 붙이므로, HTTP 로 접속하면
# 로그인 상태가 유지되지 않습니다. 로그인 정보가 평문으로 오가는 것도 막습니다.
server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Certbot 이 발급한 인증서 경로 (certbot --nginx 실행 시 자동으로 채워집니다)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 최대 업로드 크기 (애플리케이션 제한 10MB 와 맞춥니다)
    client_max_body_size 10M;

    access_log /var/log/nginx/portfolio_access.log;
    error_log  /var/log/nginx/portfolio_error.log;

    # 브라우저에 이 도메인은 항상 HTTPS 로만 접속하라고 알려 줍니다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 다른 사이트가 이 페이지를 iframe 으로 감싸는 것을 막습니다 (클릭재킹 방지)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 브라우저가 Content-Type 을 무시하고 내용을 추측하지 않게 합니다
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 업로드 파일은 Nginx 가 직접 내보냅니다 (애플리케이션을 거치지 않아 빠름)
    #
    # 주의: 여기서 내보낸 응답에는 애플리케이션이 붙이는 CSP 헤더가 없습니다.
    # SVG 는 스크립트를 품을 수 있으므로, 브라우저가 문서로 실행하지 못하게
    # 별도의 CSP 를 직접 붙입니다.
    location /uploads/ {
        alias /opt/portfolio/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/files/ {
        alias /opt/portfolio/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 나머지는 애플리케이션으로 넘깁니다
    location / {
        proxy_pass http://portfolio_backend;

        # 애플리케이션이 원래 클라이언트 IP 와 https 여부를 알 수 있게 합니다.
        # 로그인 시도 제한이 모든 요청을 Nginx 의 IP 하나로 묶지 않으려면 필요합니다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering   on;
        proxy_buffer_size 4k;
        proxy_buffers     8 4k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
