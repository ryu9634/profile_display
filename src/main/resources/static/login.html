<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - Portfolio Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%23111111%22/%3E%3Ccircle%20cx=%2216%22%20cy=%2216%22%20r=%227%22%20fill=%22%23f5f5f5%22/%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1rem;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.25rem; }
        .sub { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.4rem; }
        input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #1a1a1a; }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #333; }
        .msg {
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .msg.error { background: #fdecea; color: #b3261e; display: block; }
        .msg.info { background: #e8f4fd; color: #1a5b8f; display: block; }
        .back { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #888; text-decoration: none; }
        .back:hover { color: #333; }
    </style>
</head>
<body>
    <form class="login-box" method="post" action="/login" autocomplete="on">
        <h1>관리자 로그인</h1>
        <p class="sub">포트폴리오 관리자 페이지에 접속합니다</p>

        <div id="msg" class="msg" role="alert"></div>

        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <input type="hidden" id="csrf" name="_csrf">
        <button type="submit">로그인</button>
        <a class="back" href="/">← 사이트로 돌아가기</a>
    </form>

    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var msg = document.getElementById('msg');
            if (params.has('error')) {
                msg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
                msg.className = 'msg error';
            } else if (params.has('logout')) {
                msg.textContent = '로그아웃되었습니다.';
                msg.className = 'msg info';
            } else if (params.has('expired')) {
                msg.textContent = '로그인이 만료되었습니다. 다시 로그인해주세요.';
                msg.className = 'msg info';
            } else if (params.has('relogin')) {
                msg.textContent = '아이디가 변경되었습니다. 새 아이디로 로그인해주세요.';
                msg.className = 'msg info';
            } else if (params.has('locked')) {
                msg.textContent = '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.';
                msg.className = 'msg error';
            }

            // 서버가 쿠키로 내려준 CSRF 토큰을 폼에 담습니다.
            var token = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            if (token) {
                document.getElementById('csrf').value = decodeURIComponent(token[1]);
            }
        })();
    </script>
</body>
</html>
