# ============================================
# Portfolio Application Configuration
# ============================================

# ============================================
# Active Profile Configuration
# ============================================
# 사용 가능한 프로파일:
# - local: 로컬 개발 환경 (MariaDB localhost)
# - prod: AWS 프로덕션 환경 (RDS)
#
# 프로파일 변경 방법:
# - IDE: Run Configuration에서 -Dspring.profiles.active=local 설정
# - Command Line: java -jar -Dspring.profiles.active=prod app.jar
spring.profiles.active=local

# ============================================
# Server Configuration
# ============================================
server.port=8081
# 컨텍스트 경로 (기본값: /)
# server.servlet.context-path=/api

# ============================================
# Application Information
# ============================================
spring.application.name=Portfolio Management System

# ============================================
# JPA Common Configuration
# ============================================
# MariaDB 방언 설정
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# OSIV(Open Session In View) 비활성화 - 성능 최적화
# 뷰 렌더링 시 영속성 컨텍스트를 유지하지 않음 (REST API에 권장)
spring.jpa.open-in-view=false

# ============================================
# File Upload Configuration
# ============================================
# 파일 업로드 활성화
spring.servlet.multipart.enabled=true

# 단일 파일 최대 크기 (기본: 10MB)
spring.servlet.multipart.max-file-size=10MB

# 전체 요청 최대 크기 (기본: 10MB)
spring.servlet.multipart.max-request-size=10MB

# 임시 파일 저장 위치 (선택 사항)
# spring.servlet.multipart.location=/tmp

# ============================================
# File Storage Configuration
# ============================================
# 업로드된 파일 저장 경로
# - 상대 경로: ./uploads (애플리케이션 실행 위치 기준)
# - 절대 경로: /var/portfolio/uploads (프로덕션 권장)
file.upload-dir=./uploads

# ============================================
# Session Cookie
# ============================================
# 자바스크립트가 세션 쿠키를 읽지 못하게 합니다 (XSS 로 세션을 훔치는 경로 차단)
server.servlet.session.cookie.http-only=true

# 다른 사이트에서 넘어온 요청에는 쿠키를 붙이지 않습니다 (CSRF 완화)
server.servlet.session.cookie.same-site=lax

# HTTPS 로만 쿠키를 보냅니다. 로컬은 http 로 개발하므로 false, 운영은 true 입니다.
server.servlet.session.cookie.secure=false

# 로그인하지 않은 방문자에게는 세션을 만들지 않습니다
spring.session.timeout=2h

# ============================================
# Logging Configuration
# ============================================
# 로그 레벨 설정
logging.level.root=INFO
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# 로그 패턴 (선택 사항)
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# Security Configuration
# ============================================
# 관리자 계정 초기값
# - 최초 실행 시 이 값으로 DB(admin_account)에 계정이 만들어지고, 이후에는
#   관리자 페이지 > 계정 메뉴에서 아이디/비밀번호를 직접 변경합니다. (이 파일 값은 더 이상 쓰이지 않음)
# - 비밀번호를 잊었을 때: admin.reset-password=true 로 한 번 실행하면 아래 값으로 초기화됩니다.
#   초기화 후에는 반드시 false 로 되돌리고 재시작하세요.
# 주의: 프로덕션에서는 반드시 환경 변수로 설정하세요! (ADMIN_USERNAME / ADMIN_PASSWORD / ADMIN_RESET_PASSWORD)
admin.username=admin
admin.password=admin123
admin.reset-password=false
